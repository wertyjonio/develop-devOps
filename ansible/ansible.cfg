[defaults]
# файл со списком серверов 
inventory = inventory.ini
# под каким пользователем заходить по умолчанию 
remote_user = deploy
# какой приватный ключ использовать
private_key_file = ~/.ssh/id_ed25519
# не показывать предупреждения про автоопределение python на сервере
interpreter_python = auto_silent