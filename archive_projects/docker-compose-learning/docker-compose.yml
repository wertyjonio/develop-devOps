services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: es_database
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    networks:
      - foodtrucks

  web:
    image: wertyjonio/foodtrucks-web:latest
    container_name: flask_web_app
    command: sh -c "sleep 30 && python app.py"
    ports:
      - "5000:5000"
    environment:
      ELASTICSEARCH_HOST: es
    networks:
      - foodtrucks
    depends_on:
      - es

networks:
  foodtrucks:
    driver: bridge
