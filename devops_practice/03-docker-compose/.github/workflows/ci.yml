name: practice ci

on:
  push:
    branches: [main]
    paths:
      - "devops_practice/03-docker-compose/**"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: devops_practice/03-docker-compose
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: devops_practice/03-docker-compose/api/Dockerfile

      - name: Prepare .env
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config > /dev/null

      - name: Build image
        run: docker compose build

      - name: Smoke test
        run: |
          docker compose up -d --wait
          curl -fsS --retry 10 --retry-connrefused --retry-delay 2 --max-time 5 http://127.0.0.1:8000/health

      - name: Save logs
        if: failure()
        run: docker compose logs > logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: devops_practice/03-docker-compose/logs.txt
          retention-days: 3

      - name: Cleanup
        if: always()
        run: docker compose down -v

  scan:
    needs: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build api image
        uses: docker/build-push-action@v7
        with:
          context: devops_practice/03-docker-compose/api
          tags: api:scan
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Scan api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: api:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  publish:
    needs: scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: devops_practice/03-docker-compose/api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          labels: | 
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api