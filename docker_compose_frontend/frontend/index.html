<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Гостевая книга</title>
  <style>
    :root {
      --bg: #faf6f0; --card: #ffffff; --text: #2b2520; --muted: #8c8278;
      --accent: #d9622b; --border: #eadfd2; --ok: #22a06b; --bad: #d93025;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17130f; --card: #221c16; --text: #efe7dd; --muted: #9b9084;
        --accent: #f08a54; --border: #362d24; --ok: #3ecf8e; --bad: #f2776d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 40px 16px;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .wrap { max-width: 600px; margin: 0 auto; }
    header { margin-bottom: 24px; }
    h1 { margin: 0 0 6px; font-size: 30px; }
    .sub { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
    .dot.up { background: var(--ok); }
    .dot.down { background: var(--bad); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
    form { display: grid; gap: 10px; }
    input, textarea {
      width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .hint { font-size: 13px; color: var(--muted); }
    button {
      cursor: pointer; border: none; border-radius: 8px; padding: 10px 18px;
      font: inherit; background: var(--accent); color: #fff;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .msg-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
    .msg-name { font-weight: 600; }
    .msg-date { font-size: 13px; color: var(--muted); }
    .msg-text { white-space: pre-wrap; word-break: break-word; }
    .empty, .error { text-align: center; color: var(--muted); padding: 10px 0; }
    .error { color: var(--bad); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Гостевая книга</h1>
      <div class="sub">
        <span>Визитов: <strong id="visits">–</strong></span>
        <span>Сообщений: <strong id="count">–</strong></span>
        <span><span id="dot" class="dot"></span><span id="health">проверка…</span></span>
      </div>
    </header>

    <div class="card">
      <form id="form">
        <input id="name" placeholder="Ваше имя" maxlength="30" required>
        <textarea id="text" placeholder="Оставьте сообщение…" maxlength="300" required></textarea>
        <div class="row">
          <span class="hint" id="left">300</span>
          <button id="send" type="submit">Отправить</button>
        </div>
      </form>
      <div id="form-error"></div>
    </div>

    <div id="messages"></div>
  </div>

  <script>
    // Запросы идут на /api/..., nginx пробрасывает их в контейнер api
    const API = "/api";

    const $ = (id) => document.getElementById(id);

    async function request(path, options = {}) {
      const res = await fetch(API + path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    function renderMessages(list) {
      const box = $("messages");
      box.innerHTML = "";
      if (list.length === 0) {
        box.innerHTML = '<div class="empty">Пока никто ничего не написал. Будьте первым!</div>';
        return;
      }
      for (const m of list) {
        const card = document.createElement("div");
        card.className = "card";

        const head = document.createElement("div");
        head.className = "msg-head";

        const name = document.createElement("span");
        name.className = "msg-name";
        name.textContent = m.name;          // textContent защищает от XSS

        const date = document.createElement("span");
        date.className = "msg-date";
        date.textContent = new Date(m.createdAt).toLocaleString("ru-RU");

        const text = document.createElement("div");
        text.className = "msg-text";
        text.textContent = m.text;

        head.append(name, date);
        card.append(head, text);
        box.append(card);
      }
    }

    async function loadMessages() {
      try {
        const list = await request("/messages");
        renderMessages(list);
        $("count").textContent = list.length;
      } catch {
        $("messages").innerHTML = '<div class="error">Не удалось загрузить сообщения</div>';
      }
    }

    async function loadStats() {
      try {
        const s = await request("/stats");      // каждый вызов увеличивает счётчик визитов
        $("visits").textContent = s.visits;
        $("count").textContent = s.messages;
      } catch {}
    }

    async function checkHealth() {
      try {
        const h = await request("/health");
        $("dot").className = "dot up";
        $("health").textContent = "API и Redis работают";
      } catch {
        $("dot").className = "dot down";
        $("health").textContent = "API недоступен";
      }
    }

    $("text").addEventListener("input", () => {
      $("left").textContent = 300 - $("text").value.length;
    });

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("send");
      btn.disabled = true;
      $("form-error").textContent = "";
      try {
        await request("/messages", {
          method: "POST",
          body: JSON.stringify({ name: $("name").value, text: $("text").value }),
        });
        $("text").value = "";
        $("left").textContent = 300;
        await loadMessages();
      } catch {
        $("form-error").className = "error";
        $("form-error").textContent = "Не удалось отправить сообщение";
      } finally {
        btn.disabled = false;
      }
    });

    loadStats().then(loadMessages);
    checkHealth();
    setInterval(checkHealth, 10000);
  </script>
</body>
</html>
