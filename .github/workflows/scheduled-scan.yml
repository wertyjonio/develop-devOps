name: schedule-scan

on: 
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, frontend]
    steps: 
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.service }} image
        run: docker build -t guestbook-${{ matrix.service }}:scan guestbook-new/${{ matrix.service }}

      - name: Scan ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
        image-ref: guestbook-${{ matrix.service }}:scan
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '1'