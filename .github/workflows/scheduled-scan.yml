name: schedule-scan

on: 
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: guestbook-api
            context: guestbook-new/api

          - name: guestbook-frontend
            context: guestbook-new/frontend

          - name: todo-app
            context: archive_projects/docker-compose2/app
    steps: 
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.name }} image
        run: docker build -t guestbook-${{ matrix.name }}:scan guestbook-new/${{ matrix.context }}

      - name: Scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: guestbook-${{ matrix.name }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'