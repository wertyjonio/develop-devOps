name: todo-ci

on: 
  push: 
    branches: [main]
    paths:  
      - "archive_projects/docker-compose2/**"
      - ".github/workflows/todo-ci.yml"
  pull_request:
    paths:
      - "archive_projects/docker-compose2/**"
      - ".github/workflows/todo-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:  
        working-directory: "archive_projects/docker-compose2"
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "archive_projects/docker-compose2/app/Dockerfile"

      - name: Prepare .env
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config > /dev/null

      - name: Build image
        run: docker compose build

      - name: Smoke test
        run: |
          docker compose up -d --wait
          curl -fsS --retry 10 --retry-connrefused --retry-delay 2 --max-time 5 http://127.0.0.1:5000/health
          curl -fsS --max-time 5 -X POST http://127.0.0.1:5000/todos \
            -H "Content-Type: application/json" -d '{"title": "ci"}'
          curl -fsS --max-time 5 http://127.0.0.1:5000/todos | grep -q '"ci"'
      
      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v
  
  image-scan:
    needs: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: archive_projects/docker-compose2/app
          load: true
          tags: docker-compose2-app:scan
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Scan app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with: 
          image-ref: docker-compose2-app:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

