name:   guestbook-ci

on:
  push:
    branches: [main]
    paths: ["guestbook-new/**"]
  pull_request:
    paths: ["guestbook-new/**"]
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guestbook-new
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile (api)
        uses: hadolint/hadolint-action@v3.1.0
        with: 
          dockerfile: guestbook-new/api/Dockerfile

      - name: Lint Dockerfile (frontend)
        uses: hadolint/hadolint-action@v3.1.0
        with: 
          dockerfile: guestbook-new/frontend/Dockerfile

      - name: Prepare .env
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config > /dev/null  

      - name: Build image
        run: docker compose build

      - name: Smoke test
        run: |
          docker compose up -d --wait
          curl -f --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8081/api/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v
  publish:
    needs: lint-and-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Build and push api image
        uses: docker/build-push-action@v7
        with:
          context: guestbook-new/api
          push: true
          tags: |
            ghrc.io/${{ github.repository_owner }}/guestbook-api:latest
            ghrc.io/${{ github.repository_owner }}/guestbook-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: guestbook-new/frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/guestbook-frontend:latest
            ghcr.io/${{ github.repository_owner }}/guestbook-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

