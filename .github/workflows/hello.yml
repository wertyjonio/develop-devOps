name: hello

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Привет из CI, коммит ${GITHUB_SHA::7}"
      - run: exit 1
      - run: ls -la
      - run: docker --version
  second:
    needs: hello
    runs-on: ubuntu-latest
    steps:
      - run: echo "Привет, я запустился после hello"