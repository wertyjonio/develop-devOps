x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  edge:
  backend:
    internal: true
  metrics:
  monitoring:
    internal: true

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    user: "999:999"
    networks: [backend]
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is not set}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    image: ghcr.io/wertyjonio/guestbook-api:${TAG:-latest}
    build: ./api
    restart: unless-stopped
    init: true
    networks: [edge, backend, metrics]
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-3000}/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/wertyjonio/guestbook-frontend:${TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    networks: [edge]
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    networks: [backend, metrics]
    mem_limit: 64m
    cpus: 0.25
    read_only: true
    logging: *default-logging
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    networks: [metrics, monitoring]
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - api
      - redis-exporter

  grafana:
    image: grafana/grafana:12.0.0
    restart: unless-stopped
    networks: [monitoring]
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is not set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  redis-data:
  prometheus-data:
  grafana-data: