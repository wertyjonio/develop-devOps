x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  edge:
  backend:
    internal: true

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    user: "999:999"
    networks: [backend]
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is not set}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build: ./api
    restart: unless-stopped
    init: true
    networks: [edge, backend]
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-3000}/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [edge]
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis-data: